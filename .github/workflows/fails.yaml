name: Collect CI Failures

on:
  workflow_run:
    workflows: ['Continuous integration']  # List your CI workflow names
    types: [completed]

permissions:
  issues: write

jobs:
  collect-failures:
    runs-on: ubuntu-slim
    if: failure() || github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Comment on issue with failures
        env:
          ISSUE_NUMBER: '2456'  # Change to your tracking issue number
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;

            // Get the workflow run that triggered this workflow
            const workflowRun = context.payload.workflow_run;

            // List all jobs for the workflow run
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRun.id,
            });

            // Filter for failed jobs
            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');

            if (failedJobs.length === 0) {
              console.log('No failed jobs found');
              return;
            }

            // Build the comment
            const failedJobsList = failedJobs
              .map(job => `- [${job.name}](${job.html_url})`)
              .join('\n');

            const comment = `## CI Failure Report

            **Workflow:** ${workflowRun.name}
            **Commit:** [${workflowRun.head_sha.substring(0, 7)}](${workflowRun.html_url}/commit/${workflowRun.head_sha})
            **Time:** ${new Date(workflowRun.created_at).toISOString()}

            ### Failed Jobs
            ${failedJobsList}

            [View full workflow run](${workflowRun.html_url})`;

            // Post the comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: comment,
            });

